name: price-pilot-tests
services:
  mock-1688:
    image: price-pilot-1688:local
    environment:
      MOCK_BASE_URL: http://mock-1688:8080
    networks: [simulation]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/health]
      interval: 1s
      timeout: 3s
      retries: 30
  mock-fx:
    image: price-pilot:local
    entrypoint: [/app/mockfx]
    healthcheck:
      test: [CMD, /app/mockfx, health]
      interval: 1s
      timeout: 3s
      retries: 30
    networks: [simulation]
  mock-seerfar:
    image: price-pilot-seerfar:local
    environment:
      MOCK_BASE_URL: http://mock-seerfar:8080
    networks: [simulation]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/health]
      interval: 1s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pricepilot
      POSTGRES_PASSWORD: pricepilot
      POSTGRES_DB: pricepilot
    networks: [simulation]
    volumes: ["./postgres-init.sql:/docker-entrypoint-initdb.d/01-snapshot.sql:ro"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pricepilot -d pricepilot]
      interval: 1s
      timeout: 3s
      retries: 30
  app:
    image: price-pilot:local
    environment:
      INITIAL_DATA_MODE: demo
      SEERFAR_BASE_URL: http://mock-seerfar:8080
      SEERFAR_API_KEY: seerfar-test-key
      SEERFAR_MODE: mock
    networks: [simulation]
    volumes: [sqlite-data:/app/data]
    depends_on:
      mock-1688:
        condition: service_healthy
      mock-fx:
        condition: service_healthy
      mock-seerfar:
        condition: service_healthy
  app-postgres:
    image: price-pilot:local
    environment:
      INITIAL_DATA_MODE: demo
      DATABASE_DRIVER: postgres
      DATABASE_DSN: postgres://pricepilot:pricepilot@postgres:5432/pricepilot?sslmode=disable
      SEERFAR_BASE_URL: http://mock-seerfar:8080
      SEERFAR_API_KEY: seerfar-test-key
      SEERFAR_MODE: mock
    networks: [simulation]
    volumes: [postgres-app-data:/app/data]
    depends_on:
      mock-1688:
        condition: service_healthy
      mock-fx:
        condition: service_healthy
      mock-seerfar:
        condition: service_healthy
      postgres:
        condition: service_healthy
  go-tests:
    image: price-pilot-go-tests:local
    build:
      context: ..
      target: go-base
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    command: [go, test, ./internal/..., ./cmd/..., -race, -count=1]
    environment:
      TEST_POSTGRES_DSN: postgres://pricepilot:pricepilot@postgres:5432/pricepilot?sslmode=disable
    networks: [simulation]
    depends_on:
      postgres:
        condition: service_healthy
  snapshot-app:
    extends:
      service: app
    environment:
      INITIAL_DATA_MODE: snapshot
    volumes: [snapshot-sqlite-data:/app/data]
  snapshot-app-postgres:
    extends:
      service: app-postgres
    environment:
      INITIAL_DATA_MODE: snapshot
      DATABASE_DSN: postgres://pricepilot:pricepilot@postgres:5432/pricepilot_snapshot?sslmode=disable
    volumes: [snapshot-postgres-app-data:/app/data]
  api-tests:
    image: python:3.12-slim
    command: [python, /tests/integration.py]
    volumes: [".:/tests:ro", "./artifacts:/artifacts"]
    networks: [simulation]
    depends_on:
      app:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
  browser-tests:
    image: price-pilot-browser:local
    init: true
    command: [node, /tests/browser.cjs]
    volumes:
      - .:/tests:ro
      - ./artifacts:/artifacts
    networks: [simulation]
    depends_on:
      app:
        condition: service_healthy
networks:
  simulation:
    internal: true
volumes:
  sqlite-data:
  postgres-app-data:
  snapshot-sqlite-data:
  snapshot-postgres-app-data:
